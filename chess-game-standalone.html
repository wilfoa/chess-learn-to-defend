<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>על המשמר! שחמט לילדים</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#3B5BDB">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
    --ground: #F4F2EE;
    --card: #FFFFFF;
    --ink: #1F2433;
    --muted: #4A5163;
    --soft: #EEF0F4;
    --blue: #3B5BDB;
    --blue-soft: #EEF1FB;
    --orange: #F08C00;
    --orange-soft: #FFF4E6;
    --orange-ink: #7A4300;
    --red: #C92A2A;
    --red-soft: #FFF0F0;
    --green: #2B9A5A;
    --green-soft: #E7F5EC;
    --green-ink: #1B6B3A;
    --shadow: 0 6px 24px rgba(31, 36, 51, 0.08);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Rubik', system-ui, sans-serif;
    background: var(--ground);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header h1 {
    font-size: 2.2em;
    font-weight: 700;
}

.subtitle {
    font-size: 1.1em;
    color: var(--muted);
    margin-top: 4px;
}

.dedication {
    font-size: 0.9em;
    font-style: italic;
    color: var(--muted);
    margin-top: 4px;
}

.game-container {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
}

.board-wrapper {
    background: var(--card);
    border-radius: 24px;
    padding: 16px;
    box-shadow: var(--shadow);
}

#board {
    width: 500px;
    touch-action: none; /* stop page scrolling while dragging pieces on tablets */
}

/* ---- Controls card ---- */
.controls {
    width: 380px;
    flex-shrink: 0;
    background: var(--card);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.turn-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--green-soft);
    color: var(--green-ink);
    font-weight: 700;
}

.turn-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
}

.turn-chip.waiting {
    background: var(--soft);
    color: var(--muted);
}

.turn-chip.waiting .turn-dot {
    background: var(--muted);
    animation: pulse 1s ease-in-out infinite alternate;
}

.lang-switch {
    display: flex;
    padding: 3px;
    background: var(--soft);
    border-radius: 999px;
}

.lang-btn {
    border: none;
    padding: 6px 12px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
}

.lang-btn[aria-pressed="true"] {
    background: var(--ink);
    color: #fff;
}

.toolbar {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
}

.tool-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
}

.tool-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: var(--blue-soft);
    color: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
}

.tool-primary .tool-icon {
    background: var(--blue);
    color: #fff;
}

.tool-btn:hover .tool-icon {
    transform: translateY(-2px);
}

.tool-btn:active .tool-icon {
    transform: scale(0.95);
}

svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

[dir="rtl"] .icon-undo {
    transform: scaleX(-1);
}

/* Hint buttons with a "?" beside them */
.hint-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.hint-btn {
    flex-grow: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 18px;
    font-size: 17px;
    font-weight: 700;
    transition: transform 0.15s ease;
}

.hint-btn:active {
    transform: scale(0.98);
}

.hint-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.hint-threats {
    border: 2px solid var(--orange);
    background: var(--orange-soft);
    color: var(--orange-ink);
}

.hint-threats[aria-pressed="true"] {
    background: var(--orange);
    color: #fff;
}

.hint-danger {
    border: 2px solid #E8A3A3;
    background: var(--red-soft);
    color: var(--red);
}

.hint-count {
    margin-inline-start: auto;
    padding: 4px 10px;
    border-radius: 999px;
    background: #fff;
    color: var(--orange-ink);
    font-size: 13px;
    font-weight: 500;
}

.help-btn {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid #B5BAC6;
    background: #fff;
    color: var(--muted);
    font-weight: 700;
}

.help-btn[aria-expanded="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
}

.help-text {
    font-size: 14px;
    line-height: 1.45;
    color: var(--muted);
    margin-top: -8px;
}

/* Sections */
.section {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.section-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
}

.segmented {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    padding: 4px;
    background: var(--soft);
    border-radius: 14px;
}

.segmented label {
    position: relative;
}

.segmented input {
    position: absolute;
    opacity: 0;
    inset: 0;
    cursor: pointer;
}

.segmented span {
    display: block;
    text-align: center;
    padding: 10px 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    transition: background 0.15s ease;
}

.segmented input:checked + span {
    background: var(--blue);
    color: #fff;
    font-weight: 700;
}

.segmented input:focus-visible + span {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
}

.level-caption {
    font-size: 13px;
    color: var(--muted);
    min-height: 1.3em;
}

.setting-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
}

.toggle-caption {
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    flex-grow: 1;
}

.toggle-switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
}

.toggle-switch input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
    height: 100%;
    width: 100%;
    z-index: 1;
}

.slider {
    position: absolute;
    inset: 0;
    background-color: #C9CDD6;
    transition: 0.2s;
    border-radius: 999px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    inset-inline-start: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.2s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: var(--blue);
}

input:checked + .slider:before {
    transform: translateX(18px);
}

[dir="rtl"] input:checked + .slider:before {
    transform: translateX(-18px);
}

.captured-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 44px;
    padding: 6px 14px;
    background: #F7F7F9;
    border-radius: 12px;
    font-size: 14px;
    color: var(--muted);
}

.captured-pieces {
    font-size: 24px;
    letter-spacing: 2px;
    color: var(--ink);
}

/* How-to panel */
.info-panel {
    background: var(--card);
    border-radius: 24px;
    padding: 18px 22px;
    margin-top: 24px;
    box-shadow: var(--shadow);
}

.info-panel summary {
    font-weight: 700;
    cursor: pointer;
}

.info-panel ul {
    margin-top: 12px;
    padding-inline-start: 20px;
    color: var(--muted);
    line-height: 1.7;
}

/* ---- Board highlights ---- */
.square-highlight {
    border-radius: 4px;
    pointer-events: none;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { opacity: 0.85; }
    50% { opacity: 0.45; }
    100% { opacity: 0.85; }
}

.selected-square {
    background: rgba(59, 91, 219, 0.35);
    border: 3px solid rgba(59, 91, 219, 0.9);
}

.threatened-square {
    background: rgba(255, 0, 0, 0.2);
    border-style: solid;
    border-color: rgba(220, 0, 0, 0.9);
}

.square-attacker {
    background: rgba(240, 140, 0, 0.3);
    border: 3px solid rgba(240, 140, 0, 0.9);
}

/* King in check: pulsing red ring with a small alert badge */
.check-square {
    border: 4px solid #e00;
    background: radial-gradient(circle, rgba(255, 0, 0, 0.45) 0%, rgba(255, 0, 0, 0) 75%);
    animation: check-pulse 1s ease-in-out infinite alternate;
}

.check-square::after {
    content: '⚠️';
    position: absolute;
    top: -2px;
    right: 0;
    font-size: 14px;
    line-height: 1;
}

@keyframes check-pulse {
    from { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.6) inset; }
    to { box-shadow: 0 0 12px 4px rgba(255, 0, 0, 0.6) inset; }
}

/* ---- Dialogs ---- */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background-color: rgba(31, 36, 51, 0.45);
    backdrop-filter: blur(4px);
}

.modal-content {
    background: var(--card);
    margin: 15vh auto 0;
    padding: 28px;
    border-radius: 24px;
    width: 340px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    animation: modalSlideIn 0.25s ease-out;
}

@keyframes modalSlideIn {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
}

.modal-content h3 {
    margin-bottom: 20px;
    font-size: 1.4em;
}

#warnText {
    margin-bottom: 20px;
    line-height: 1.5;
}

.modal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.pill-btn {
    padding: 14px 18px;
    border: none;
    border-radius: 14px;
    background: var(--soft);
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
}

.pill-primary {
    background: var(--blue);
    color: #fff;
}

.color-options {
    display: flex;
    gap: 16px;
    justify-content: center;
}

.color-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px;
    min-width: 110px;
    border: 3px solid transparent;
    border-radius: 18px;
    background: var(--soft);
    color: var(--ink);
    font-size: 1.1em;
    font-weight: 700;
    transition: transform 0.15s ease, border-color 0.15s ease;
}

.color-btn:hover {
    border-color: var(--blue);
    transform: translateY(-2px);
}

.piece-icon {
    font-size: 2.5em;
    line-height: 1;
}

/* Floating message: never pushes the layout */
.toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translate(-50%, -20px);
    width: max-content;
    max-width: min(90vw, 460px);
    padding: 12px 20px;
    border-radius: 16px;
    background: var(--red);
    color: #fff;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 8px 24px rgba(31, 36, 51, 0.25);
    z-index: 900;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
}

.toast.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}

.toast.good {
    background: var(--green-ink);
}

/* Save / load dialogs */
.modal-note {
    color: var(--muted);
    font-size: 14px;
    margin: -8px 0 14px;
}

.field-label {
    display: block;
    text-align: start;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
}

.text-field {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    border: 2px solid #D5D9E2;
    border-radius: 12px;
    font: inherit;
    font-size: 16px; /* 16px keeps iOS from zooming in */
}

.text-field:focus {
    outline: none;
    border-color: var(--blue);
}

.saved-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 50vh;
    overflow-y: auto;
    margin-bottom: 14px;
}

.saved-row {
    display: flex;
    gap: 6px;
}

.saved-item {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 12px 14px;
    border: 2px solid transparent;
    border-radius: 14px;
    background: var(--blue-soft);
    color: var(--ink);
    text-align: start;
}

.saved-item:hover {
    border-color: var(--blue);
}

.saved-name {
    font-weight: 700;
}

.saved-meta {
    font-size: 13px;
    color: var(--muted);
}

.saved-delete {
    width: 44px;
    flex-shrink: 0;
    border: none;
    border-radius: 14px;
    background: var(--soft);
    color: var(--muted);
    font-size: 20px;
}

.saved-delete:hover {
    background: var(--red-soft);
    color: var(--red);
}

/* ---- Responsive ---- */
@media (max-width: 960px) {
    .game-container {
        flex-direction: column;
        align-items: center;
    }

    .controls {
        width: 100%;
        max-width: 532px;
    }
}

@media (max-width: 560px) {
    body {
        padding: 10px;
    }

    header h1 {
        font-size: 1.6em;
    }

    .board-wrapper {
        width: 100%;
        padding: 8px;
        border-radius: 16px;
        user-select: none;
        -webkit-user-select: none;
    }

    #board {
        width: 100%;
    }

    .controls {
        padding: 16px;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 data-i18n="appTitle">על המשמר!</h1>
            <p class="subtitle" data-i18n="subtitle">שחמט לילדים: למדו לזהות איומים ולהגן על הכלים שלכם</p>
            <p class="dedication" data-i18n="dedication">מוקדש באהבה לאדם וילף ❤️</p>
        </header>

        <div class="game-container">
            <div class="board-wrapper">
                <div id="board"></div>
            </div>

            <div class="controls">
                <div class="card-top">
                    <div class="turn-chip" id="turnChip">
                        <span class="turn-dot"></span>
                        <span id="currentTurnText"></span>
                    </div>
                    <div class="lang-switch" role="group" aria-label="Language / שפה">
                        <button type="button" class="lang-btn" data-lang="he" lang="he">עב</button>
                        <button type="button" class="lang-btn" data-lang="en" lang="en">EN</button>
                    </div>
                </div>

                <div class="toolbar">
                    <button id="resetBtn" class="tool-btn tool-primary">
                        <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></span>
                        <span data-i18n="newGame">משחק חדש</span>
                    </button>
                    <button id="undoBtn" class="tool-btn">
                        <span class="tool-icon"><svg class="icon-undo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>
                        <span data-i18n="undo">חזרה</span>
                    </button>
                    <button id="saveBtn" class="tool-btn">
                        <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span>
                        <span data-i18n="save">שמירה</span>
                    </button>
                    <button id="loadBtn" class="tool-btn">
                        <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
                        <span data-i18n="load">טעינה</span>
                    </button>
                </div>

                <div class="hint-row">
                    <button type="button" id="showThreats" class="hint-btn hint-threats" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                        <span data-i18n="whoThreatens">מי מאיים?</span>
                        <span class="hint-count" id="hintCount" hidden></span>
                    </button>
                    <button type="button" class="help-btn" data-i18n-aria="explain" aria-label="הסבר" aria-expanded="false" aria-controls="hintInfo">?</button>
                </div>
                <p id="hintInfo" class="help-text" hidden></p>

                <div class="hint-row">
                    <button type="button" id="showDanger" class="hint-btn hint-danger">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 20h18z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
                        <span data-i18n="myPiecesInDanger">הכלים שלי בסכנה</span>
                    </button>
                    <button type="button" class="help-btn" data-i18n-aria="explain" aria-label="הסבר" aria-expanded="false" aria-controls="dangerInfo">?</button>
                </div>
                <p id="dangerInfo" class="help-text" data-i18n="dangerInfo" hidden></p>

                <div class="section">
                    <div class="section-label" id="levelLabel" data-i18n="level">רמה</div>
                    <div class="segmented" role="radiogroup" aria-labelledby="levelLabel">
                        <label><input type="radio" name="difficulty" value="beginner" checked><span data-i18n="level_beginner">מתחיל</span></label>
                        <label><input type="radio" name="difficulty" value="attacker"><span data-i18n="level_attacker">תוקף</span></label>
                        <label><input type="radio" name="difficulty" value="medium"><span data-i18n="level_medium">בינוני</span></label>
                        <label><input type="radio" name="difficulty" value="hard"><span data-i18n="level_hard">קשה</span></label>
                    </div>
                    <p class="level-caption" id="levelCaption"></p>
                    <div class="setting-row">
                        <label class="toggle-switch">
                            <input type="checkbox" id="limitHints">
                            <span class="slider"></span>
                        </label>
                        <label for="limitHints" class="toggle-caption" data-i18n="limitHints">הגבלת רמזים לפי רמה</label>
                        <button type="button" class="help-btn" data-i18n-aria="explain" aria-label="הסבר" aria-expanded="false" aria-controls="limitInfo">?</button>
                    </div>
                    <p id="limitInfo" class="help-text" data-i18n="limitInfo" hidden></p>
                </div>

                <div class="section">
                    <div class="section-label" data-i18n="captured">נאכלו</div>
                    <div class="captured-row">
                        <span data-i18n="youCaptured">אכלתם</span>
                        <span class="captured-pieces" id="youCaptured"></span>
                    </div>
                    <div class="captured-row">
                        <span data-i18n="computerCaptured">המחשב אכל</span>
                        <span class="captured-pieces" id="computerCaptured"></span>
                    </div>
                </div>
            </div>
        </div>

        <details class="info-panel">
            <summary data-i18n="howTo">איך משחקים?</summary>
            <ul>
                <li data-i18n="howTo1"></li>
                <li data-i18n="howTo2"></li>
                <li data-i18n="howTo3"></li>
                <li data-i18n="howTo4"></li>
                <li data-i18n="howTo5"></li>
                <li data-i18n="howTo6"></li>
            </ul>
        </details>
    </div>

    <!-- Color Selection Modal -->
    <div id="colorModal" class="modal">
        <div class="modal-content">
            <h3 data-i18n="pickColor">באיזה צבע תשחקו?</h3>
            <div class="color-options">
                <button id="playWhite" class="color-btn">
                    <span class="piece-icon">♔</span>
                    <span data-i18n="white">לבן</span>
                </button>
                <button id="playBlack" class="color-btn">
                    <span class="piece-icon">♚</span>
                    <span data-i18n="black">שחור</span>
                </button>
            </div>
        </div>

let lang = 'he';
try { if (STRINGS[localStorage.getItem('lang')]) lang = localStorage.getItem('lang'); } catch (e) {}

function t(key, vars = {}) {
    return String(STRINGS[lang][key] ?? key).replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
}

// Switch every text on the page, plus direction (RTL for Hebrew)
function applyLanguage(newLang) {
    lang = STRINGS[newLang] ? newLang : 'he';
    try { localStorage.setItem('lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
    document.title = t('pageTitle');
    $('[data-i18n]').each(function() { this.textContent = t(this.dataset.i18n); });
    $('[data-i18n-aria]').each(function() { this.setAttribute('aria-label', t(this.dataset.i18nAria)); });
    $('.lang-btn').each(function() { this.setAttribute('aria-pressed', String(this.dataset.lang === lang)); });
    updateStatus();
    updateCapturedPieces();
    updateHintInfo();
}
let selectedSquare = null; // For tap-to-see-threats feature
let showingSquareThreats = false;
let playerColor = 'white'; // Player's color choice
let moveFrom = null; // Tap-to-move: selected source square

// Configuration for chessboard
const config = {
    draggable: true,
    position: 'empty',
    onDragStart: onDragStart,
    onDrop: onDrop,
    onSnapEnd: onSnapEnd,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
};

// Initialize the board
$(document).ready(function() {
    board = Chessboard('board', config);
    $(window).on('resize', () => {
        board.resize();
        clearSquareThreats();
        showAutoHints();
    });
    
    // One delegated handler survives every board redraw (tap-to-move and tap-to-see-threats)
    $board.on('click', '[data-square]', function() {
        onSquareClick($(this).attr('data-square'));
    });
    
    // Event listeners
    $('#resetBtn').on('click', showColorSelectionModal);
    $('#undoBtn').on('click', undoMove);
    $('#saveBtn').on('click', saveGame);
    $('#loadBtn').on('click', loadGame);
    $('#showThreats').on('click', function() {
        setThreatMode(!showThreats);
        if (!showThreats) {
            clearSquareThreats();
            showAutoHints();
        }
    });
    $('input[name="difficulty"]').on('change', function() {
        difficulty = this.value;
        clearSquareThreats();
        showAutoHints();
        updateHintInfo();
    });
    $('#showDanger').on('click', flashDangerPieces);
    $('#limitHints').prop('checked', limitHints).on('change', function() {
        limitHints = this.checked;
        try { localStorage.setItem('limitHints', limitHints ? '1' : '0'); } catch (e) {}
        updateHintInfo();
    });
    $('.lang-btn').on('click', function() { applyLanguage(this.dataset.lang); });
    applyLanguage(lang);
    // Every "?" button shows/hides the explanation it points to
    $('.help-btn').on('click', function() {
        const $info = $('#' + $(this).attr('aria-controls'));
        const show = $info.prop('hidden');
        $info.prop('hidden', !show);
        $(this).attr('aria-expanded', show);
    });

    // Modal event listeners
    $('#playWhite').on('click', () => startNewGame('white'));
    $('#playBlack').on('click', () => startNewGame('black'));
    $('#saveForm').on('submit', confirmSave);
    $('#endNewGame').on('click', () => { $('#endModal').hide(); showColorSelectionModal(); });
    $('.modal-close').on('click', function() { $(this).closest('.modal').hide(); });
    // Tapping outside a dialog closes it, except the blunder warning, which needs an answer
    $('.modal').not('#warnModal').on('click', function(e) { if (e.target === this) $(this).hide(); });
    $('#warnKeep').on('click', keepWarnedMove);
    $('#warnUndo').on('click', takeBackWarnedMove);
});

// "Who's attacking?" is armed until the next square tap
function setThreatMode(on) {
    showThreats = on;
    $('#showThreats').attr('aria-pressed', String(on));
}

// Check if a piece can be dragged
function onDragStart(source, piece, position, orientation) {
    // Don't allow moves if game is over
    if (isGameOver()) return false;

    // Threat detector is armed: a tap on a piece should show its threats, so don't start a drag
    if (showThreats) return false;

    // Don't allow moves during computer's turn
    if (isComputerTurn) return false;
    
    // In computer mode, only allow player's color pieces to be moved
    const playerPieces = playerColor === 'white' ? /^w/ : /^b/;
    if (gameMode === 'computer' && !piece.match(playerPieces)) {
        return false;
    }
    
    // Only pick up pieces for the side to move
    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
        (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
    }
}

// Handle piece drop (a tap on own piece arrives here as source === target)
function onDrop(source, target) {
    if (source === target) {
        $('.square-highlight.selected-square').remove(); // keep hint/check marks visible
        moveFrom = source;
        addSquareHighlight(source, 'selected-square', 0);
        return 'snapback';
    }
    if (!tryMove(source, target)) return 'snapback';
}

// Make the player's move; returns false if illegal
function tryMove(source, target) {
    const me = game.turn();

    // Try to make the move
    let move = game.move({
        from: source,
        to: target,
        promotion: 'q' // Always promote to queen for simplicity
    });

    if (move === null) {
        return false;
    }

    updateStatus();
    updateCapturedPieces();

    // Clear any threat displays after a move
    clearSquareThreats();

    // Lower levels: ask before a move that leaves a piece to be captured (an even-or-better trade doesn't count)
    if (LEVELS[difficulty].warnBlunders && !isGameOver()) {
        const tradedFairly = move.captured && PIECE_VALUES[move.captured] >= PIECE_VALUES[move.piece];
        const hanging = hangingPieces(me).filter(sq => !(tradedFairly && sq === move.to));
        if (hanging.length) {
            showBlunderWarning(hanging);
            return true;
        }
    }

    afterPlayerMove();
    return true;
}

function afterPlayerMove() {
    // If it's computer's turn, make computer move
    const computerColor = playerColor === 'white' ? 'b' : 'w';
    if (gameMode === 'computer' && game.turn() === computerColor && !isGameOver()) {
        setTimeout(makeComputerMove, 500); // Small delay for better UX
    }
}

function showBlunderWarning(squares) {
    const enemy = game.turn();
    const names = squares.map(sq => t('pieceRef', { piece: getPieceText(game.get(sq).type), sq })).join(', ');
    $('#warnText').text(t('warnText', { pieces: names }));
    squares.forEach(sq => addSquareHighlight(sq, 'threatened-square', attackersOf(sq, enemy).length));
    isComputerTurn = true; // block moves until the child decides
    $('#warnModal').show();
}

function keepWarnedMove() {
    $('#warnModal').hide();
    isComputerTurn = false;
    clearSquareThreats();
    afterPlayerMove();
}

function takeBackWarnedMove() {
    $('#warnModal').hide();
    isComputerTurn = false;
    game.undo();
    board.position(game.fen());
    clearSquareThreats();
    updateStatus();
    updateCapturedPieces();
    showAutoHints();
}

// Update board position after the piece snap
function onSnapEnd() {
    board.position(game.fen());
}

// Undo last move
// Take back the child's last move and the computer's reply. Uses game.undo() so the move
// history (and with it the captured-pieces list) stays intact
function undoMove() {
    const me = playerColor === 'white' ? 'w' : 'b';
    if (isComputerTurn || !game.history({ verbose: true }).some(m => m.color === me)) return;
    while (game.undo().color !== me) {}
    board.position(game.fen());
    clearSquareThreats();
    updateStatus();
    updateCapturedPieces();
    showAutoHints();
}

// Games end only when nobody can win. Repetition and the 50-move rule are left out on purpose:
// in real chess a player has to claim them, and for kids they cut games short that are still being played
function isGameOver() {
    return game.in_checkmate() || game.in_stalemate() || game.insufficient_material();
}

// Short message floating over the page, gone after a few seconds
let toastTimer = null;
function showToast(text, good = false) {
    clearTimeout(toastTimer);
    $('#gameStatus').text(text).toggleClass('good', good).addClass('show');
    toastTimer = setTimeout(() => $('#gameStatus').removeClass('show'), 3000);
}

// Turn chip, plus a message (and a game-over dialog) when the game state changes
let lastStatus = '';
function updateStatus() {
    const myTurn = game.turn() === (playerColor === 'white' ? 'w' : 'b');
    $('#currentTurnText').text(myTurn ? t('yourTurn') : t('computerThinking'));
    $('#turnChip').toggleClass('waiting', !myTurn && !isGameOver());

    let status = '';
    if (game.in_checkmate()) status = myTurn ? 'computerWins' : 'youWin';
    else if (game.in_stalemate()) status = 'stalemate';
    else if (game.insufficient_material()) status = 'insufficient';
    else if (game.in_check()) status = myTurn ? 'youInCheck' : 'computerInCheck';
    if (status && status !== lastStatus) {
        showToast(t(status), status === 'youWin' || status === 'computerInCheck');
        if (isGameOver()) {
            $('#endText').text(t(status));
            $('#endModal').show();
        }
    }
    lastStatus = status;
}

// Captured pieces, from the child's point of view
function updateCapturedPieces() {
    const captured = getCapturedPieces();
    const mine = playerColor, theirs = playerColor === 'white' ? 'black' : 'white';
    $('#youCaptured').text(captured[theirs].map(p => getPieceSymbol(p, theirs)).join(''));
    $('#computerCaptured').text(captured[mine].map(p => getPieceSymbol(p, mine)).join(''));
}

// Get lists of captured pieces
function getCapturedPieces() {
    const history = game.history({ verbose: true });
    const captured = { white: [], black: [] };
    
    history.forEach(move => {
        if (move.captured) {
            // The color of the captured piece is opposite to the player who made the move
            const capturedColor = move.color === 'w' ? 'black' : 'white';
            captured[capturedColor].push(move.captured);
        }
    });
    
    return captured;
}

// Convert piece code to symbol
function getPieceSymbol(piece, color) {
    const whiteSymbols = {
        'p': '♙',
        'n': '♘',
        'b': '♗',
        'r': '♖',
        'q': '♕',
        'k': '♔'
    };
    const blackSymbols = {
        'p': '♟',
        'n': '♞',
        'b': '♝',
        'r': '♜',
        'q': '♛',
        'k': '♚'
    };
    
    if (color === 'white') {
        return whiteSymbols[piece] || piece;
    } else {
        return blackSymbols[piece] || piece;
    }
}

// Computer AI Functions
function makeComputerMove() {
    const computerColor = playerColor === 'white' ? 'b' : 'w';
    if (isGameOver() || game.turn() !== computerColor) return;
    
    isComputerTurn = true;
    const moves = game.moves({ verbose: true });
    
    if (moves.length === 0) {
        isComputerTurn = false;
        return;
    }
    
    const level = LEVELS[difficulty];
    const selectedMove = level.depth ? getSearchMove(moves, level.depth) : getTeachingMove(moves, level);
    
    // Make the move
    if (selectedMove) {
        game.move(selectedMove);
        board.position(game.fen());
        
        updateStatus();
        updateCapturedPieces();
        clearSquareThreats();
        showAutoHints();
    }
    
    isComputerTurn = false;
}

function randomOf(items) {
    return items[Math.floor(Math.random() * items.length)];
}

// Beginner/Attacker: punish pieces the child left hanging, sometimes leave one of ours hanging on purpose,
// otherwise Beginner plays randomly and Attacker picks the move that creates the biggest threat
function getTeachingMove(moves, level) {
    const me = game.turn();
    const you = me === 'w' ? 'b' : 'w';
    
    // Free material: an undefended piece, or one worth more than the piece taking it
    const grabs = moves.filter(m => m.captured &&
        (!attackersOf(m.to, you).length || PIECE_VALUES[m.piece] < PIECE_VALUES[m.captured]));
    if (grabs.length) {
        const best = Math.max(...grabs.map(m => PIECE_VALUES[m.captured]));
        return randomOf(grabs.filter(m => PIECE_VALUES[m.captured] === best));
    }
    
    const scored = moves.map(move => {
        game.move(move);
        const score = { move, threat: hangingValue(you), gift: hangingValue(me) };
        game.undo();
        return score;
    });
    const giftNow = hangingValue(me);
    
    // Deliberate mistake: give the child something to capture
    if (Math.random() < level.blunder) {
        const gifts = scored.filter(s => s.gift > giftNow);
        if (gifts.length) return randomOf(gifts).move;
    }
    
    if (difficulty === 'beginner') return randomOf(moves);
    
    const scoreOf = s => s.threat - s.gift;
    const best = Math.max(...scored.map(scoreOf));
    return randomOf(scored.filter(s => scoreOf(s) === best)).move;
}

// Medium/Hard: pick randomly among the best moves found by a material search `depth` plies deep
function getSearchMove(moves, depth) {
    let bestMoves = [];
    let bestScore = -Infinity;
    moves.forEach(move => {
        game.move(move);
        const score = -negamax(depth - 1, -Infinity, Infinity);
        game.undo();
        if (score > bestScore) {
            bestScore = score;
            bestMoves = [move];
        } else if (score === bestScore) {
            bestMoves.push(move);
        }
    });
    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}

// Alpha-beta search; score is from the side to move's point of view
function negamax(depth, alpha, beta) {
    if (depth === 0) return materialScore(game.turn());
    const moves = game.moves({ verbose: true });
    if (moves.length === 0) return game.in_check() ? -10000 - depth : 0; // mate sooner is worse; stalemate is 0
    moves.sort((a, b) => (b.captured ? 1 : 0) - (a.captured ? 1 : 0)); // captures first prunes more
    for (const move of moves) {
        game.move(move);
        const score = -negamax(depth - 1, -beta, -alpha);
        game.undo();
        if (score >= beta) return score;
        if (score > alpha) alpha = score;
    }
    return alpha;
}

function materialScore(color) {
    let score = 0;
    game.board().forEach(row => row.forEach(piece => {
        if (piece) score += piece.color === color ? PIECE_VALUES[piece.type] : -PIECE_VALUES[piece.type];
    }));
    return score;
}

// Tap-to-see-threats functionality
function onSquareClick(square) {
    // Tap-to-move: second tap on a destination square
    if (!showThreats) {
        if (!moveFrom || square === moveFrom) return;
        const from = moveFrom;
        clearSquareThreats();
        if (tryMove(from, square)) onSnapEnd();
        return;
    }
    
    // Show threats and automatically disable toggle
    showThreatsToSquare(square);
}

function showThreatsToSquare(square) {
    clearSquareThreats();
    showCheckMark();
    selectedSquare = square;
    showingSquareThreats = true;
    
    hintsUsed++;
    updateHintInfo();
    
    // Find all pieces of the side that just moved that attack this square
    const attackers = attackersOf(square, game.turn() === 'w' ? 'b' : 'w');
    
    // Highlight the selected square with red border based on threat count
    if (attackers.length > 0) {
        // The selected square gets a red border with thickness based on threat count
        addSquareHighlight(square, 'threatened-square', attackers.length);
        
        // Highlight attacking pieces
        attackers.forEach(attackerSquare => {
            addSquareHighlight(attackerSquare, 'square-attacker', 0);
        });
        
    } else {
        // No threats - just show blue selection
        addSquareHighlight(square, 'selected-square', 0);
    }
    
    // Turn off the toggle after showing threats (makes kid "work" for the hint)
    setThreatMode(false);
}

// Squares of `color` pieces that attack `square` (pins are ignored, like "who is aiming at this square")
function attackersOf(square, color) {
    const b = game.board(); // b[row][col], row 0 is rank 8
    const tc = square.charCodeAt(0) - 97, tr = 8 - parseInt(square[1]);
    const out = [];
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const p = b[r][c];
            if (!p || p.color !== color || (r === tr && c === tc)) continue;
            const dr = tr - r, dc = tc - c, ar = Math.abs(dr), ac = Math.abs(dc);
            let hit = false;
            if (p.type === 'p') hit = ac === 1 && dr === (color === 'w' ? -1 : 1);
            else if (p.type === 'n') hit = ar * ac === 2;
            else if (p.type === 'k') hit = Math.max(ar, ac) === 1;
            else if ((p.type !== 'b' && (dr === 0 || dc === 0)) || (p.type !== 'r' && ar === ac)) {
                // Slider on a matching line: every square in between must be empty
                const sr = Math.sign(dr), sc = Math.sign(dc);
                hit = true;
                for (let rr = r + sr, cc = c + sc; rr !== tr || cc !== tc; rr += sr, cc += sc) {
                    if (b[rr][cc]) { hit = false; break; }
                }
            }
            if (hit) out.push(String.fromCharCode(97 + c) + (8 - r));
        }
    }
    return out;
}

// Pieces of `color` (not the king) that can be won: undefended, or attacked by something cheaper
function hangingPieces(color) {
    const enemy = color === 'w' ? 'b' : 'w';
    const out = [];
    game.board().forEach((row, r) => row.forEach((p, c) => {
        if (!p || p.color !== color || p.type === 'k') return;
        const sq = String.fromCharCode(97 + c) + (8 - r);
        const attackers = attackersOf(sq, enemy);
        if (!attackers.length) return;
        // A king can only take undefended pieces, so treat it as the most expensive attacker
        const cheapest = Math.min(...attackers.map(a => game.get(a).type === 'k' ? 100 : PIECE_VALUES[game.get(a).type]));
        if (!attackersOf(sq, color).length || cheapest < PIECE_VALUES[p.type]) out.push(sq);
    }));
    return out;
}

function hangingValue(color) {
    return hangingPieces(color).reduce((sum, sq) => sum + PIECE_VALUES[game.get(sq).type], 0);
}

// Marks that stay on the board while it's the child's turn: their king in check (all levels),
// and on Beginner their pieces in danger
function showAutoHints() {
    const me = playerColor === 'white' ? 'w' : 'b';
    if (game.turn() !== me) return;
    showCheckMark();
    if (LEVELS[difficulty].autoHints) {
        const enemy = me === 'w' ? 'b' : 'w';
        hangingPieces(me).forEach(sq => addSquareHighlight(sq, 'threatened-square', attackersOf(sq, enemy).length));
    }
}

function showCheckMark() {
    if (!game.in_check()) return;
    const me = game.turn();
    const kingSq = game.board().flat().map((p, i) => p && p.type === 'k' && p.color === me ? String.fromCharCode(97 + i % 8) + (8 - Math.floor(i / 8)) : null).find(Boolean);
    addSquareHighlight(kingSq, 'check-square', 0);
}

// Hint budget (only when limits are on); both detectors are disabled when it runs out
function updateHintInfo() {
    const level = LEVELS[difficulty];
    const limit = limitHints ? level.hintLimit : Infinity;
    const left = limit - hintsUsed;
    $('#showThreats, #showDanger').prop('disabled', left <= 0);
    $('#hintCount').prop('hidden', !(limit > 0 && limit < Infinity)).text(t('hintsLeft', { n: Math.max(left, 0) }));
    let text;
    if (limit === Infinity) text = t('hintInfoUnlimited');
    else if (limit === 0) text = t('hintInfoNone');
    else if (left > 0) text = t('hintInfoLeft', { n: left });
    else text = t('hintInfoOut');
    if (level.autoHints) text += t('hintInfoBeginner');
    $('#hintInfo').text(text);
    $('#levelCaption').text(t('caption_' + difficulty));
}

// One-shot hint: mark every piece of the child's that is attacked right now, for a moment
function flashDangerPieces() {
    const me = playerColor === 'white' ? 'w' : 'b';
    const enemy = me === 'w' ? 'b' : 'w';
    hintsUsed++;
    updateHintInfo();
    $('.danger-flash').remove();
    let found = 0;
    game.board().forEach((row, r) => row.forEach((p, c) => {
        if (!p || p.color !== me || p.type === 'k') return;
        const sq = String.fromCharCode(97 + c) + (8 - r);
        const attackers = attackersOf(sq, enemy).length;
        if (attackers) {
            found++;
            addSquareHighlight(sq, 'threatened-square', attackers)?.addClass('danger-flash');
        }
    }));
    if (!found) showToast(t('noDanger'), true);
    setTimeout(() => $('.danger-flash').remove(), 2500);
}

function clearSquareThreats() {
    $('.square-highlight').remove();
    selectedSquare = null;
    showingSquareThreats = false;
    moveFrom = null;
}

function addSquareHighlight(square, className, threatCount) {
    const $square = $board.find('.square-' + square);
    const position = $square.position();
    
    if (!position) return;
    
    const highlight = $('<div>');
    highlight.addClass('square-highlight');
    highlight.addClass(className);
    
    // Calculate border thickness based on threat count
    let borderThickness = 3;
    if (className === 'threatened-square') {
        // For threatened squares: 3px per threat (1 threat = 3px, 2 threats = 6px, etc)
        borderThickness = Math.min(threatCount * 3, 15);
    }
    
    highlight.css({
        position: 'absolute',
        top: position.top + 'px',
        left: position.left + 'px',
        width: $square.width() + 'px',
        height: $square.height() + 'px',
        pointerEvents: 'none',
        zIndex: 3, // Lower z-index to not interfere with pieces
        borderWidth: borderThickness + 'px',
        boxSizing: 'border-box'
    });
    
    $board.append(highlight);
    return highlight;
}

function getPieceText(pieceType) {
    return STRINGS[lang].pieces[pieceType] || pieceType;
}

// Show color selection modal
function showColorSelectionModal() {
    $('#colorModal').show();
}

// Start new game with selected color
function startNewGame(color) {
    playerColor = color;
    
    // Hide modal
    $('#colorModal').hide();
    $('#endModal').hide();
    lastStatus = '';
    
    // Reset game
    game.reset();
    
    // Set board orientation based on player color
    board.orientation(color);
    board.start();
    
    hintsUsed = 0;
    updateHintInfo();
    clearSquareThreats();
    
    // Turn off threat toggle on new game
    setThreatMode(false);
    
    updateStatus();
    updateCapturedPieces();
    
    
    // If player chose black, computer makes first move
    if (color === 'black') {
        setTimeout(makeComputerMove, 1000);
    }
}

// Saved games live in this browser (localStorage), newest last
function readSaves() {
    try { return JSON.parse(localStorage.getItem('chessGames') || '[]'); } catch (e) { return []; }
}

function writeSaves(saves) {
    try { localStorage.setItem('chessGames', JSON.stringify(saves)); return true; } catch (e) { return false; }
}

// Save: ask for a name first
function saveGame() {
    if (game.history().length === 0) {
        showToast(t('noGameToSave'));
        return;
    }
    $('#saveName').val(t('defaultSaveName', { n: game.history().length }));
    $('#saveModal').show();
    $('#saveName').trigger('focus').trigger('select');
}

function confirmSave(e) {
    e.preventDefault();
    const name = $('#saveName').val().trim() || t('defaultSaveName', { n: game.history().length });
    const saves = readSaves();
    saves.push({
        id: Date.now(),
        name,
        timestamp: new Date().toLocaleString(lang === 'he' ? 'he-IL' : 'en-US'),
        moves: game.history().length,
        fen: game.fen(),
        pgn: game.pgn(), // full move list, so captured pieces and undo survive a reload
        playerColor,
        difficulty
    });
    while (saves.length > 20) saves.shift();
    $('#saveModal').hide();
    showToast(writeSaves(saves) ? t('saved', { name }) : t('saveFailed'), true);
}

// Load: a tappable list, newest first, each with a delete button
function loadGame() {
    renderSavedList();
    $('#loadModal').show();
}

function renderSavedList() {
    const saves = readSaves();
    const $list = $('#savedList').empty();
    $('#noSaves').prop('hidden', saves.length > 0);
    saves.slice().reverse().forEach(saved => {
        const level = LEVELS[saved.difficulty] ? saved.difficulty : 'beginner';
        const $open = $('<button type="button" class="saved-item">')
            .append($('<span class="saved-name">').text(saved.name))
            .append($('<span class="saved-meta">').text(`${saved.timestamp} · ${t('level_' + level)}`))
            .on('click', () => restoreGame(saved));
        const $delete = $('<button type="button" class="saved-delete">×</button>')
            .attr('aria-label', t('deleteSave', { name: saved.name }))
            .on('click', () => {
                writeSaves(readSaves().filter(g => g.id !== saved.id));
                renderSavedList();
            });
        $list.append($('<li class="saved-row">').append($open, $delete));
    });
}

function restoreGame(savedGame) {
    $('#loadModal').hide();
    try {
        if (!(savedGame.pgn && game.load_pgn(savedGame.pgn))) game.load(savedGame.fen); // older saves have only the position
        playerColor = savedGame.playerColor;
        difficulty = LEVELS[savedGame.difficulty] ? savedGame.difficulty : 'beginner'; // old saves used 'easy'
        hintsUsed = 0;
        lastStatus = '';

        board.orientation(playerColor);
        board.position(game.fen());
        $(`input[name="difficulty"][value="${difficulty}"]`).prop('checked', true);

        clearSquareThreats();
        setThreatMode(false);
        updateStatus();
        updateCapturedPieces();
        updateHintInfo();
        showAutoHints();
        afterPlayerMove(); // saved while the computer was thinking: let it move
        showToast(t('loaded', { name: savedGame.name }), true);
    } catch (error) {
        showToast(t('loadError'));
        console.error('Load game error:', error);
    }
}
